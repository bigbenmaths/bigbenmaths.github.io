<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>คำขอเข้าใช้งาน</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171d24;
      --line: #2a3440;
      --text: #e8eef4;
      --muted: #93a0ae;
      --soft: #c5d0db;
      --accent: #3dd6c6;
      --good: #5bd38a;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Sarabun", "IBM Plex Sans Thai", "Noto Sans Thai", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    a { color: var(--accent); }
    .wrap { max-width: 800px; margin: 0 auto; padding: 24px 18px 80px; }
    h1 { margin: 8px 0 12px; font-size: 28px; }
    h2 { margin: 28px 0 8px; font-size: 20px; }
    p { color: var(--soft); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
    }
    .name { font-size: 18px; font-weight: 700; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 6px; word-break: break-all; white-space: pre-wrap; }
    .tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    button.ok, button.bad, button.ghost {
      margin-top: 10px;
      margin-right: 8px;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.ok { background: var(--good); color: #06221f; }
    button.bad { background: var(--bad); color: #2a0606; }
    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--soft);
    }
    .empty { color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    body.bb-locked .bb-app { display: none !important; }
  </style>
</head>
<body class="bb-locked">
  <div class="wrap bb-app">
    <a href="/">← หน้าแรก</a>
    <h1>จัดการสิทธิ์</h1>
    <p>คนใหม่แค่ลองล็อกอิน แล้วชื่อจะโผล่ที่คำขอ กดอนุมัติแล้วจะไปอยู่ในไวท์ลิสต์</p>
    <div class="row">
      <button type="button" class="ghost" id="reload">รีเฟรช</button>
    </div>

    <h2>คำขอเข้าใช้งาน</h2>
    <div id="requests" class="empty">กำลังโหลด...</div>

    <h2>ไวท์ลิสต์</h2>
    <p>คนที่เข้าเว็บได้แล้ว ลบออกได้ ยกเว้นบัญชีถาวร</p>
    <div id="allowed" class="empty">กำลังโหลด...</div>
  </div>
  <script type="module" src="/auth.js?v=20260814g"></script>
  <script type="module">
    import { getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc,
      deleteDoc,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const OWNER_EMAIL = "bigbenmaths@gmail.com";
    const LOCKED = [
      {
        name: "เจ้าของเว็บ",
        email: OWNER_EMAIL,
        lineUid: "U78834db84391fd380b5c1d3de33db1c0",
        uid: "saLW92gjCYfmzaScQYUnoym1ZHf2",
        locked: true,
      },
    ];

    function db() {
      return getFirestore(getApp());
    }

    function isOwner(user) {
      return String(user.email || "").toLowerCase() === OWNER_EMAIL;
    }

    function text(el, value) {
      el.textContent = value;
      return el;
    }

    function card(item, extraLines, actions) {
      const el = document.createElement("div");
      el.className = "card";
      const name = document.createElement("div");
      name.className = "name";
      text(name, item.name || item.email || "(ไม่มีชื่อ)");
      const meta = document.createElement("div");
      meta.className = "meta";
      text(meta, extraLines.filter(Boolean).join("\n"));
      el.appendChild(name);
      el.appendChild(meta);
      for (const btn of actions) el.appendChild(btn);
      return el;
    }

    function button(label, className, onClick) {
      const btn = document.createElement("button");
      btn.className = className;
      btn.textContent = label;
      btn.onclick = onClick;
      return btn;
    }

    async function approve(item) {
      const firestore = db();
      const payload = {
        uid: item.uid,
        lineUid: item.lineUid || "",
        name: item.name || "",
        email: item.email || "",
        approvedAt: Date.now(),
      };
      await setDoc(doc(firestore, "bb_pages_allowed", item.uid), payload);
      if (item.lineUid) {
        await setDoc(doc(firestore, "bb_pages_allowed", item.lineUid), payload);
      }
      await deleteDoc(doc(firestore, "bb_pages_requests", item.uid));
      await load();
    }

    async function revoke(item) {
      if (!confirm(`ลบ ${item.name || item.email || item.uid} ออกจากไวท์ลิสต์?`)) return;
      const firestore = db();
      const keys = [...new Set([item.uid, item.lineUid, ...(item.docIds || [])].filter(Boolean))];
      await Promise.all(keys.map((key) => deleteDoc(doc(firestore, "bb_pages_allowed", key))));
      await load();
    }

    function lockedKeys() {
      return new Set(
        LOCKED.flatMap((item) => [item.uid, item.lineUid, item.email].filter(Boolean))
      );
    }

    async function loadRequests() {
      const box = document.getElementById("requests");
      box.textContent = "กำลังโหลด...";
      const snap = await getDocs(collection(db(), "bb_pages_requests"));
      const rows = snap.docs
        .map((d) => d.data())
        .sort((a, b) => (b.at || 0) - (a.at || 0));
      if (!rows.length) {
        box.innerHTML = '<p class="empty">ยังไม่มีคำขอใหม่</p>';
        return;
      }
      box.innerHTML = "";
      for (const item of rows) {
        const when = item.at ? new Date(item.at).toLocaleString("th-TH") : "";
        box.appendChild(card(
          item,
          [when, item.email && `อีเมล: ${item.email}`, `LINE: ${item.lineUid || "-"}`, `UID: ${item.uid || "-"}`],
          [button("อนุมัติเข้าไวท์ลิสต์", "ok", () => approve(item))]
        ));
      }
    }

    async function loadAllowed() {
      const box = document.getElementById("allowed");
      box.textContent = "กำลังโหลด...";
      const snap = await getDocs(collection(db(), "bb_pages_allowed"));
      const grouped = new Map();
      for (const d of snap.docs) {
        const data = d.data() || {};
        const key = data.uid || data.lineUid || d.id;
        if (!grouped.has(key)) {
          grouped.set(key, {
            uid: data.uid || "",
            lineUid: data.lineUid || "",
            name: data.name || "",
            email: data.email || "",
            approvedAt: data.approvedAt || 0,
            docIds: [d.id],
          });
        } else {
          const row = grouped.get(key);
          row.docIds.push(d.id);
          row.uid = row.uid || data.uid || "";
          row.lineUid = row.lineUid || data.lineUid || "";
          row.name = row.name || data.name || "";
          row.email = row.email || data.email || "";
          row.approvedAt = row.approvedAt || data.approvedAt || 0;
        }
      }

      const locked = lockedKeys();
      const rows = [...grouped.values()]
        .filter((item) => ![item.uid, item.lineUid, item.email].some((v) => locked.has(v)))
        .sort((a, b) => (b.approvedAt || 0) - (a.approvedAt || 0));

      box.innerHTML = "";
      for (const item of LOCKED) {
        const el = card(
          item,
          [
            `อีเมล: ${item.email}`,
            `LINE: ${item.lineUid}`,
            `UID: ${item.uid}`,
          ],
          []
        );
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = "ถาวร ลบไม่ได้";
        el.appendChild(tag);
        box.appendChild(el);
      }

      if (!rows.length && !LOCKED.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "ยังไม่มีคนในไวท์ลิสต์";
        box.appendChild(empty);
        return;
      }

      for (const item of rows) {
        const when = item.approvedAt ? new Date(item.approvedAt).toLocaleString("th-TH") : "";
        box.appendChild(card(
          item,
          [
            when && `อนุมัติ: ${when}`,
            item.email && `อีเมล: ${item.email}`,
            `LINE: ${item.lineUid || "-"}`,
            `UID: ${item.uid || "-"}`,
          ],
          [button("ลบออกจากไวท์ลิสต์", "bad", () => revoke(item))]
        ));
      }
    }

    async function load() {
      await Promise.all([loadRequests(), loadAllowed()]);
    }

    function start(user) {
      if (!isOwner(user)) {
        document.querySelector(".wrap").innerHTML = `
          <a href="/">← หน้าแรก</a>
          <h1>เข้าไม่ได้</h1>
          <p>หน้านี้ใช้ได้เฉพาะบัญชี Google ${OWNER_EMAIL}</p>
        `;
        return;
      }
      document.getElementById("reload").onclick = load;
      load();
    }

    if (window.bbCurrentUser) start(window.bbCurrentUser);
    window.addEventListener("bb-authed", (e) => start(e.detail));
  </script>
</body>
</html>
